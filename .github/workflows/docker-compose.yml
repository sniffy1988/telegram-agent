name: docker-compose

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FAMILYAI_IMAGE: ghcr.io/sniffy1988/familyai-bot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pytest
        run: pytest -q

      - name: Compile
        run: python -m compileall -q .

  compose-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build with Docker Compose (PR smoke)
        env:
          FAMILYAI_TAG: ci
        run: docker compose -f docker-compose.yml build

  build-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (docker compose)
        run: |
          SHORT="${GITHUB_SHA::7}"
          export FAMILYAI_TAG="sha-${SHORT}"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml build --push
          docker buildx imagetools create -t "${FAMILYAI_IMAGE}:latest" "${FAMILYAI_IMAGE}:sha-${SHORT}"
