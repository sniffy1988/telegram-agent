services:
  familyai:
    build: .
    image: familyai-bot:local
    container_name: familyai-bot
    env_file: .env
    environment:
      MEMORY_PATH: /app/data/memory.json
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b-mlx}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-180}
      HOME_ASSISTANT_URL: ${HOME_ASSISTANT_URL:-http://10.10.30.18:8123}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
